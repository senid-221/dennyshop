<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="robots" content="noindex, nofollow">
  <link rel="shortcut icon" href="/images/favicon.png">
  <title>Denny Shop - Dashboard</title>
  <!-- the shop's own theme -->
  <link rel="stylesheet" href="/css/bootstrap.css">
  <link href="/css/font-awesome.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/responsive.css" rel="stylesheet">
  <link href="/css/shop-modern.css" rel="stylesheet">
  <!-- dashboard layer, same palette and type -->
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="sub_page admin_page">

  <!-- login -->
  <div class="hero_area admin_hero" id="login_view">
    <div class="admin_login_wrap">
      <form class="admin_login_box shop-form" id="login_form" novalidate>
        <div class="logo_footer">
          <a href="/"><img width="190" src="/images/logo.png" alt="Denny Shop"></a>
        </div>
        <div class="heading_container heading_center">
          <h2>Dashboard</h2>
        </div>
        <p class="modal_sub">Sign in to manage products, colours, orders, reels and advertiser links.</p>
        <label for="login_email">Email</label>
        <input id="login_email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="you@example.com">
        <label for="login_password">Password</label>
        <input id="login_password" name="password" type="password" autocomplete="current-password">
        <p class="field_error" id="login_error"></p>
        <button type="submit" class="shop-btn">Sign in</button>
        <p class="hint">No account? The shop owner adds you under Team.</p>
      </form>
    </div>
  </div>

  <!-- app -->
  <div id="app_view" hidden>
    <div class="hero_area admin_head_area">
      <header class="header_section">
        <div class="container">
          <nav class="navbar navbar-expand-lg custom_nav-container">
            <a class="navbar-brand" href="/"><img width="250" src="/images/logo.png" alt="Denny Shop"></a>
            <div class="collapse navbar-collapse show">
              <ul class="navbar-nav admin_who">
                <li class="nav-item"><span class="nav-link who_name" id="who_name"></span></li>
                <li class="nav-item"><span class="nav-link who_role" id="who_role"></span></li>
                <li class="nav-item"><a class="nav-link" href="/">Shop</a></li>
                <li class="nav-item"><button type="button" class="btn_signout" id="logout_btn">Sign out</button></li>
              </ul>
            </div>
          </nav>
        </div>
      </header>
      <section class="inner_page_head">
        <div class="container_fuild">
          <div class="row">
            <div class="col-md-12">
              <div class="full">
                <h3 id="panel_title">Dashboard</h3>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <nav class="admin_tabs" id="tabs" aria-label="Dashboard sections"></nav>

    <main class="container admin_main">
      <section class="panel admin_panel" id="panel_orders" hidden>
        <div class="filters">
          <select id="orders_status" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="new">New</option>
            <option value="paid">Paid claimed</option>
            <option value="confirmed">Confirmed</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <input id="orders_q" type="search" placeholder="Name, phone or order code" aria-label="Search orders">
          <input id="orders_affiliate" type="search" placeholder="Advertiser code" aria-label="Filter by advertiser code">
          <button type="button" class="chip" id="orders_refresh">Refresh</button>
        </div>
        <p class="count" id="orders_count"></p>
        <div id="orders_list" class="rows"></div>
      </section>

      <section class="panel admin_panel" id="panel_products" hidden>
        <div class="filters">
          <input id="products_q" type="search" placeholder="Search products" aria-label="Search products">
          <button type="button" class="chip" id="product_new_btn">New product</button>
        </div>
        <div id="products_list" class="rows"></div>
      </section>

      <section class="panel admin_panel" id="panel_reels" hidden>
        <div class="filters">
          <button type="button" class="chip" id="reel_new_btn">Add reel</button>
        </div>
        <div id="reels_list" class="rows"></div>
      </section>

      <section class="panel admin_panel" id="panel_affiliates" hidden>
        <div class="filters">
          <button type="button" class="chip" id="aff_new_btn">New advertiser</button>
        </div>
        <div id="affiliates_list" class="rows"></div>
      </section>

      <section class="panel admin_panel" id="panel_team" hidden>
        <div class="filters">
          <button type="button" class="chip" id="user_new_btn">Add account</button>
        </div>
        <div id="team_list" class="rows"></div>
      </section>

      <section class="panel admin_panel" id="panel_settings" hidden>
        <div id="settings_host"></div>
      </section>

      <section class="panel admin_panel" id="panel_me" hidden>
        <div id="me_view"></div>
      </section>
    </main>

    <div class="cpy_">
      <p>&copy; <span id="displayYear"></span> Denny Shop &middot; Muhanga, Rwanda &middot; dashboard</p>
    </div>
  </div>

  <div class="shop-backdrop" id="modal_backdrop" hidden></div>
  <div class="shop-modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="Editor"></div>

  <p class="toast" id="toast" hidden></p>

  <script src="/js/jquery-3.4.1.min.js"></script>
  <script src="/js/popper.min.js"></script>
  <script src="/js/bootstrap.js"></script>
  <script src="/js/custom.js"></script>
  <script src="admin.js"></script>
</body>
</html>
